name: Construir APK desde ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descomprimir el ZIP del proyecto
        run: |
          ZIP=$(ls -1 *.zip | head -n1)
          echo "Usando: $ZIP"
          mkdir -p _app
          unzip -q "$ZIP" -d _app
          PKG=$(find _app -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n1)
          [ -n "$PKG" ] || { echo "No se encontró package.json dentro del ZIP"; exit 1; }
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Crear proyecto Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: simulador-capacitores-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
